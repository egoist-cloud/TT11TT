services:
  - type: web
    name: TT11TT
    env: python
    plan: free
    buildCommand: "apt-get update && apt-get install -y libffi-dev libsodium-dev && pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DISCORD_TOKEN_1
        sync: false
      - key: DISCORD_TOKEN_2
        sync: false
      - key: DISCORD_TOKEN_3
        sync: false
      - key: DISCORD_TOKEN_4
        sync: false
      - key: DISCORD_TOKEN_5
        sync: false
      - key: VOICE_CHANNEL_ID
        sync: false
      - key: USER_ID_1
        sync: false
      - key: USER_ID_2
        sync: false
      - key: USER_ID_3
        sync: false
      - key: USER_ID_4
        sync: false
      - key: MAIN_BOT_USER_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: RENDER_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STATUS_ROTATION
        value: "false"
