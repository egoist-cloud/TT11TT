services:
  - type: web
    name: TT11TT
    env: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Токены Discord-аккаунтов
      - key: DISCORD_TOKEN_1
        sync: false
      - key: DISCORD_TOKEN_2
        sync: false
      - key: DISCORD_TOKEN_3
        sync: false
      - key: DISCORD_TOKEN_4
        sync: false
      - key: DISCORD_TOKEN_5
        sync: false
      - key: DISCORD_TOKEN_6
        sync: false

      # Сервер / голосовой канал
      - key: VOICE_CHANNEL_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: USER_ID_1
        sync: false
      - key: USER_ID_2
        sync: false

      # Прочее
      - key: SPAM_CHANNEL_ID
        value: "1270672504582832150"
      - key: REPORT_CHANNEL_ID        # канал, где команды работают всегда
        value: "1241013075151425650"
      - key: ALLOW_COMMANDS_IN_GUILD  # команды в любом канале сервера
        value: "true"
      - key: COMMAND_CHANNEL_IDS      # доп. каналы через запятую (необязательно)
        sync: false
      - key: ALLOWED_USER_IDS         # кто может управлять (ID через запятую; владельцы и так разрешены)
        sync: false
      - key: STATUS_ROTATION
        value: "false"
      - key: PING_INTERVAL
        value: "240"
      - key: HEARTBEAT_TIMEOUT
        value: "180"
      - key: MAX_RESTARTS
        value: "50"
      - key: PYTHONUNBUFFERED
        value: "1"
