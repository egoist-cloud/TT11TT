services:
  - type: web
    name: TT11TT
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DISCORD_TOKEN_1
        sync: false
      - key: DISCORD_TOKEN_2
        sync: false
      - key: DISCORD_TOKEN_3
        sync: false
      - key: DISCORD_TOKEN_4
        sync: false
      - key: DISCORD_TOKEN_5
        sync: false
      - key: DISCORD_TOKEN_6
        sync: false
      - key: VOICE_CHANNEL_ID
        sync: false
      - key: USER_ID_1
        sync: false
      - key: USER_ID_2
        sync: false
      - key: GUILD_ID
        sync: false
      - key: RENDER_URL
        sync: false
      - key: STATUS_ROTATION
        value: "false"
